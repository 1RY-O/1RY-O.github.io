<!DOCTYPE html>
<!-- ══════════════════════════════════════════════════════════════════════════
     KINETIC VOID · dark-mode developer-portfolio UI mockup
     cyber-brutalist · pulsating vortex core · four modular panels
     electrical-storm lighting · glitch + data-stream turbulence
     decorative artifact only: no readable text, no logos, no photography
     ══════════════════════════════════════════════════════════════════════════ -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>*</title>
<style>
/* ═════════ 1 · TOKENS + PALETTE ═════════ */
:root{
  --ink:#03040A;
  --blue:#1B4DFF;   --blue2:#63B4FF;   --cyan:#8FF6FF;
  --purple:#6A18FF; --purple2:#B981FF;
  --green:#8CFF1A;  --green2:#D8FF63;
  --f:0;            /* flash energy 0→1  (JS)  */
  --f2:0;           /* secondary strobe    */
  --gx:0px;         /* glitch offset x     */
  --gy:0px;         /* glitch offset y     */
  --hud:rgba(120,190,255,.42);
  --mono:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --arc:conic-gradient(#000 0 7deg,transparent 7deg 46deg,#000 46deg 52deg,transparent 52deg 108deg,
         #000 108deg 114deg,transparent 114deg 190deg,#000 190deg 196deg,transparent 196deg 268deg,
         #000 268deg 274deg,transparent 274deg 360deg);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);font-family:var(--mono);overflow:hidden;
  -webkit-font-smoothing:antialiased;cursor:crosshair}
::selection{background:var(--green);color:#000}

/* ═════════ 2 · ATMOSPHERE ═════════ */
.sky{position:fixed;inset:0;overflow:hidden;background:
  radial-gradient(122% 92% at 50% 48%,#11142f 0%,#080a1c 38%,#04050e 68%,#010206 100%)}
.sky::before{content:"";position:absolute;inset:-25%;filter:blur(30px);
  animation:wash 26s linear infinite;
  background:
    radial-gradient(38% 44% at 22% 26%,rgba(106,24,255,.30),transparent 70%),
    radial-gradient(42% 38% at 78% 30%,rgba(27,77,255,.28),transparent 72%),
    radial-gradient(50% 46% at 50% 86%,rgba(140,255,26,.10),transparent 74%),
    conic-gradient(from 210deg at 50% 50%,rgba(27,77,255,.10),rgba(106,24,255,.16),
      rgba(140,255,26,.06),rgba(27,77,255,.10))}
@keyframes wash{to{transform:rotate(360deg) scale(1.06)}}

#cv-streams{position:absolute;inset:0;width:100%;height:100%;
  mix-blend-mode:screen;filter:blur(.3px)}

.grid{position:absolute;left:-10%;right:-10%;top:-10%;bottom:-10%;pointer-events:none;opacity:.34;
  background-image:
    linear-gradient(rgba(99,180,255,.10) 1px,transparent 1px),
    linear-gradient(90deg,rgba(99,180,255,.10) 1px,transparent 1px),
    linear-gradient(rgba(185,129,255,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(185,129,255,.055) 1px,transparent 1px);
  background-size:6.5vmin 6.5vmin,6.5vmin 6.5vmin,1.62vmin 1.62vmin,1.62vmin 1.62vmin;
  transform:perspective(58vmin) rotateX(62deg) scale(2.1);transform-origin:50% 0;
  animation:gridRun 5.4s linear infinite}
@keyframes gridRun{to{background-position:0 6.5vmin,6.5vmin 0,0 1.62vmin,1.62vmin 0}}

.noise{position:absolute;inset:0;pointer-events:none;opacity:.085;mix-blend-mode:overlay;
  animation:noiseShift .5s steps(3) infinite;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
@keyframes noiseShift{
  0%{transform:translate(0,0)}20%{transform:translate(-3%,2%)}40%{transform:translate(2%,-3%)}
  60%{transform:translate(-2%,-2%)}80%{transform:translate(3%,1%)}100%{transform:translate(0,0)}}

.scan{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.55) 0 1px,transparent 1px 3px)}
.scanbar{position:absolute;left:0;right:0;height:22vmin;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(180deg,transparent,rgba(99,180,255,.09) 40%,rgba(140,255,26,.12) 62%,transparent);
  animation:barSweep 4.6s cubic-bezier(.6,0,.4,1) infinite}
@keyframes barSweep{0%{top:-24vmin}100%{top:104vmin}}

.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(78% 68% at 50% 50%,transparent 40%,rgba(0,0,0,.72) 88%,#000 100%)}
#bolt-layer{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:68;
  mix-blend-mode:screen;overflow:visible}
@keyframes boltDraw{to{stroke-dashoffset:0}}

.flashlayer{position:fixed;inset:0;pointer-events:none;z-index:70;mix-blend-mode:screen;
  background:
    radial-gradient(60% 50% at 50% 50%,rgba(190,225,255,.85),transparent 70%),
    linear-gradient(105deg,rgba(99,180,255,.35),rgba(185,129,255,.25) 50%,rgba(140,255,26,.22));
  opacity:calc(var(--f) * .62)}
.blackout{position:fixed;inset:0;pointer-events:none;z-index:69;background:#000;
  opacity:calc(var(--f2) * .82)}

/* ═════════ 3 · RIG ═════════ */
.stage{position:fixed;inset:0;display:grid;place-items:center;z-index:5;
  filter:brightness(calc(1 + var(--f) * .85)) saturate(calc(1 + var(--f) * .55))
         contrast(calc(1 + var(--f) * .18))}
.rig{position:relative;z-index:2;width:min(99.2vw,166vh);height:min(97vh,104vw);
  display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.94fr) minmax(0,1fr);
  gap:clamp(6px,1.1vmin,16px)}
.rail{position:relative;display:grid;grid-template-rows:1fr 1fr;
  gap:clamp(6px,1.1vmin,16px);min-width:0;min-height:0}
.rail>.panel{width:min(100%,47vmin);justify-self:center}
.vxcol{position:relative;display:grid;place-items:center;min-width:0}

.bus{position:absolute;top:-4%;bottom:-4%;width:2px;pointer-events:none;opacity:.4;
  background:repeating-linear-gradient(180deg,var(--blue2) 0 10px,transparent 10px 22px);
  filter:drop-shadow(0 0 5px rgba(99,180,255,.7))}
.bus.l{left:-.6vmin}.bus.r{right:-.6vmin}

.hud{position:absolute;inset:-2.2vmin -3.2vmin;pointer-events:none}
.hud .rail-h{position:absolute;left:0;right:0;height:6px;opacity:.55;
  background:repeating-linear-gradient(90deg,var(--hud) 0 1px,transparent 1px 9px)}
.hud .rail-h.t{top:0}.hud .rail-h.b{bottom:0}
.hud .rail-v{position:absolute;top:0;bottom:0;width:6px;opacity:.55;
  background:repeating-linear-gradient(180deg,var(--hud) 0 1px,transparent 1px 9px)}
.hud .rail-v.l{left:0}.hud .rail-v.r{right:0}
.tick{position:absolute;width:14px;height:14px;border:2px solid var(--green);opacity:.8;
  box-shadow:0 0 8px var(--green)}
.tick.a{top:-2px;left:-2px;border-right:0;border-bottom:0}
.tick.b{top:-2px;right:-2px;border-left:0;border-bottom:0}
.tick.c{bottom:-2px;left:-2px;border-right:0;border-top:0}
.tick.d{bottom:-2px;right:-2px;border-left:0;border-top:0}
.tick::after{content:"";position:absolute;inset:3px;background:var(--green);opacity:.55;
  animation:tickBlink 1.7s steps(2) infinite}
@keyframes tickBlink{50%{opacity:0}}
/* ═════════ 4 · VORTEX CORE ═════════ */
.vortex{position:relative;width:min(100%,54vmin);aspect-ratio:1;display:grid;place-items:center;
  isolation:isolate}
.vortex::after{content:"";position:absolute;inset:-4%;border-radius:50%;
  border:1px dashed rgba(99,180,255,.22);animation:spin 34s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.halo{position:absolute;inset:-38%;border-radius:50%;pointer-events:none;filter:blur(14px);
  background:radial-gradient(circle,rgba(27,77,255,.34),rgba(106,24,255,.16) 42%,transparent 66%);
  animation:haloBreathe 3.1s ease-in-out infinite}
@keyframes haloBreathe{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.14);opacity:1}}

.ring{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen}
.ring.r1{inset:0;border:1px solid rgba(99,180,255,.5);
  -webkit-mask-image:var(--arc);mask-image:var(--arc);
  filter:drop-shadow(0 0 7px rgba(99,180,255,.85));animation:spin 11s linear infinite}
.ring.r2{inset:7%;border:2px dotted rgba(185,129,255,.65);
  filter:drop-shadow(0 0 9px rgba(185,129,255,.7));animation:spin 7s linear reverse infinite}
.ring.r3{inset:14%;border:1px solid rgba(140,255,26,.55);border-left-color:transparent;
  border-right-color:transparent;filter:drop-shadow(0 0 10px rgba(140,255,26,.6));
  animation:spin 4.3s linear infinite}
.ring.r4{inset:21%;border:3px double rgba(99,180,255,.35);animation:spin 2.4s linear reverse infinite}
.ring.r5{inset:27%;border:1px dashed rgba(216,255,99,.5);opacity:.8;animation:spin 1.7s linear infinite}
.ring.r6{inset:-6%;border:1px solid rgba(99,180,255,.22);animation:spin 46s linear infinite}

.orbit{position:absolute;inset:0;pointer-events:none;animation:spin 9s linear infinite}
.orbit.o2{inset:9%;animation-duration:5.6s;animation-direction:reverse}
.orbit.o3{inset:17%;animation-duration:3.2s}
.onode{position:absolute;top:50%;left:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
  border-radius:50%;background:var(--cyan);color:var(--cyan);
  transform:rotate(var(--or,0deg)) translateY(calc(-1 * var(--od,20vmin)));
  box-shadow:0 0 12px var(--cyan),0 0 26px rgba(99,180,255,.8)}
.onode.g{background:var(--green);color:var(--green);
  box-shadow:0 0 12px var(--green),0 0 26px rgba(140,255,26,.7)}
.onode.p{background:var(--purple2);color:var(--purple2);
  box-shadow:0 0 12px var(--purple2),0 0 26px rgba(185,129,255,.7)}
.onode.big{width:14px;height:14px;margin:-7px 0 0 -7px}
.onode::after{content:"";position:absolute;inset:-9px;border:1px solid currentColor;opacity:.4;
  animation:ping 1.5s ease-out infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.7}100%{transform:scale(1.7);opacity:0}}

#cv-vortex{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:screen}
.core{position:absolute;width:26%;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 50%,#fff 0%,var(--cyan) 12%,var(--blue2) 32%,
    var(--blue) 52%,var(--purple) 74%,transparent 88%);
  filter:blur(1.5px) saturate(1.3);
  box-shadow:0 0 40px rgba(99,180,255,.7),0 0 90px rgba(106,24,255,.5),0 0 160px rgba(140,255,26,.22);
  animation:corePulse 1.6s cubic-bezier(.4,0,.2,1) infinite,coreJit 7s steps(1) infinite}
@keyframes corePulse{0%,100%{transform:scale(1)}22%{transform:scale(1.14)}
  48%{transform:scale(.94)}70%{transform:scale(1.08)}}
@keyframes coreJit{0%{border-radius:50%}33%{border-radius:48% 52% 50% 50%/52% 48% 52% 48%}
  66%{border-radius:52% 48% 49% 51%/49% 51% 49% 51%}}
.corewrap{position:absolute;width:44%;aspect-ratio:1;display:grid;place-items:center;
  mix-blend-mode:screen;animation:spin 3.9s linear infinite}
.spoke{position:absolute;inset:0;opacity:.75;filter:blur(2px);
  -webkit-mask-image:radial-gradient(circle,transparent 22%,#000 30%,#000 100%);
  mask-image:radial-gradient(circle,transparent 22%,#000 30%,#000 100%);
  background:conic-gradient(from 0deg,rgba(255,255,255,.9),rgba(99,180,255,.35) 8deg,transparent 26deg,
    rgba(140,255,26,.5) 40deg,transparent 58deg,rgba(185,129,255,.45) 74deg,transparent 92deg)}

/* connector traces: vortex → panels */
#traces{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:0}
#traces path{fill:none;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:5 11;
  filter:drop-shadow(0 0 5px currentColor);animation:traceRun 1.15s linear infinite}
@keyframes traceRun{to{stroke-dashoffset:-32}}
#traces .tr-a{stroke:rgba(99,180,255,.6);color:rgba(99,180,255,.7)}
#traces .tr-b{stroke:rgba(185,129,255,.55);color:rgba(185,129,255,.65);animation-duration:.82s}
#traces .tr-c{stroke:rgba(140,255,26,.5);color:rgba(140,255,26,.6);animation-duration:1.6s}
#traces .tr-d{stroke:rgba(143,246,255,.45);color:rgba(143,246,255,.6);animation-duration:.62s}

/* ═════════ 5 · PANELS ═════════ */
.panel{position:relative;display:flex;flex-direction:column;overflow:hidden;min-height:0;
  padding:clamp(6px,.9vmin,13px);
  background:linear-gradient(180deg,rgba(10,14,30,.90),rgba(4,6,16,.94)),
    repeating-linear-gradient(45deg,rgba(99,180,255,.045) 0 2px,transparent 2px 7px);
  box-shadow:calc(9px + var(--f) * 16px) calc(9px + var(--f) * 16px) 0 rgba(0,0,0,.92),
    calc(9px + var(--f) * 16px) calc(9px + var(--f) * 16px) 0 1px rgba(99,180,255,.30),
    inset 0 0 42px rgba(27,77,255,.16);
  transition:box-shadow .05s linear}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;
  opacity:calc(var(--f) * .5);
  background:linear-gradient(120deg,rgba(99,180,255,.5),transparent 42%,rgba(140,255,26,.35))}
.panel>*{position:relative;z-index:2}
.panel-frame{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;
  overflow:visible}
.panel-frame .wire{fill:none;stroke:rgba(99,180,255,.75);stroke-width:1;
  vector-effect:non-scaling-stroke;filter:drop-shadow(0 0 3px rgba(99,180,255,.8))}
.panel-frame .wire2{fill:none;stroke:rgba(185,129,255,.5);stroke-width:.6;
  vector-effect:non-scaling-stroke}
.panel-frame .wire-dash{fill:none;stroke:var(--green);stroke-width:1.6;
  vector-effect:non-scaling-stroke;stroke-dasharray:18 10 3 10;opacity:.85;
  filter:drop-shadow(0 0 6px rgba(140,255,26,.9));animation:dash 2.6s linear infinite}
@keyframes dash{to{stroke-dashoffset:-82}}
.panel-frame .wire-ghost{fill:none;stroke:var(--green2);stroke-width:1;
  vector-effect:non-scaling-stroke;opacity:calc(var(--f) * .95);
  transform:translate(calc(var(--gx) * -1.6),calc(var(--gy) * -1.6))}
.panel-frame .bkt{fill:none;stroke:var(--cyan);stroke-width:2.4;vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 6px rgba(143,246,255,.9))}
.panel-frame .b2{stroke:var(--green);filter:drop-shadow(0 0 6px rgba(140,255,26,.9))}
.panel-frame .b3{stroke:var(--purple2);filter:drop-shadow(0 0 6px rgba(185,129,255,.9))}
.panel-frame .b4{stroke:var(--blue2);filter:drop-shadow(0 0 6px rgba(99,180,255,.9))}
.tear{position:absolute;left:0;right:0;height:2.4%;opacity:0;mix-blend-mode:screen;
  filter:blur(1px);pointer-events:none;
  background:linear-gradient(90deg,transparent,var(--cyan),var(--green),transparent)}

.phead{display:flex;align-items:center;gap:.7vmin;padding-bottom:.6vmin;
  border-bottom:1px solid rgba(99,180,255,.22)}
.chip{width:2.1vmin;height:2.1vmin;min-width:9px;min-height:9px;border:1px solid var(--green);
  background:rgba(140,255,26,.16);box-shadow:0 0 9px rgba(140,255,26,.6);
  animation:chipSpin 2.9s steps(8) infinite}
.chip.b{border-color:var(--purple2);background:rgba(185,129,255,.16);
  box-shadow:0 0 9px rgba(185,129,255,.6)}
.chip.c{border-color:var(--cyan);background:rgba(143,246,255,.16);
  box-shadow:0 0 9px rgba(143,246,255,.6)}
.chip.d{border-color:var(--blue2);background:rgba(99,180,255,.16);
  box-shadow:0 0 9px rgba(99,180,255,.9)}
@keyframes chipSpin{50%{transform:rotate(180deg) scale(1.3)}}
.glyphbar{flex:1;display:flex;gap:2px;overflow:hidden;height:1.15vmin;min-height:4px}
.glyphbar i{flex:1;background:linear-gradient(90deg,var(--blue2),var(--purple2));opacity:.5;
  animation:gbar 1.4s ease-in-out infinite}
.glyphbar i:nth-child(2n){background:linear-gradient(90deg,var(--green),var(--cyan));
  animation-duration:.9s}
.glyphbar i:nth-child(3n){animation-duration:2.1s}
.glyphbar i:nth-child(5n){animation-duration:.55s}
@keyframes gbar{0%,100%{transform:scaleY(.22);opacity:.28}50%{transform:scaleY(1);opacity:1}}
.pdial{position:relative;flex:0 0 auto;width:2.6vmin;height:2.6vmin;min-width:11px;min-height:11px;
  border-radius:50%;border:1px solid rgba(99,180,255,.55)}
.pdial::before{content:"";position:absolute;left:50%;top:50%;width:42%;height:1px;
  background:var(--green);transform-origin:0 50%;box-shadow:0 0 6px var(--green);
  animation:dialSpin 1.1s cubic-bezier(.5,0,.5,1) infinite}
.pdial::after{content:"";position:absolute;inset:2px;border-radius:50%;
  border:1px dotted rgba(185,129,255,.6);animation:spin 2.6s linear infinite}
@keyframes dialSpin{0%{transform:rotate(0)}50%{transform:rotate(320deg)}100%{transform:rotate(-40deg)}}

.pbody{flex:1;min-height:0;display:grid;gap:.7vmin;padding-top:.7vmin}
.p-zap{position:absolute;inset:0;z-index:4;pointer-events:none;mix-blend-mode:screen;
  opacity:calc(var(--f) * .45);
  background:linear-gradient(90deg,transparent 46%,rgba(255,255,255,.9) 50%,transparent 54%)}
canvas.viz{width:100%;height:100%;display:block;flex:1;min-height:0}
.zstack{position:relative;flex:1;min-height:0;display:flex}
.zstack canvas{position:absolute;inset:0;flex:none}

/* code-rain */
.rain{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);
  align-items:start;gap:2px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(180deg,transparent,#000 12%,#000 88%,transparent)}
.rain-col{display:flex;flex-direction:column;gap:1px;will-change:transform;
  animation:rainUp var(--d,3s) linear infinite;animation-delay:var(--dl,0s)}
.rain-col span{font-size:clamp(7px,1.02vmin,13px);line-height:1.12;color:var(--blue2);
  text-shadow:0 0 5px currentColor;opacity:.55}
.rain-col span:nth-child(7n){color:var(--green);opacity:.9}
.rain-col span:nth-child(5n){color:var(--purple2)}
.rain-col span:nth-child(3n){color:var(--cyan)}
.rain-col span:nth-child(11n){color:#fff}
.rain-col span:nth-child(4n){animation:flick .34s steps(2) infinite}
.rain-col span:nth-child(9n){animation:flick .5s steps(3) infinite .1s}
@keyframes rainUp{from{transform:translateY(-50%)}to{transform:translateY(0)}}
@keyframes flick{0%{opacity:1}50%{opacity:.15}51%{opacity:1}}
.readout{display:grid;gap:2px}
.readout .row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.6vmin}
.readout .tick{position:static;width:6px;height:6px;border-width:1px}
.readout .bar{height:clamp(3px,.5vmin,7px);background:rgba(99,180,255,.12);position:relative;
  overflow:hidden;border-left:1px solid rgba(99,180,255,.5)}
.readout .bar i{position:absolute;inset:0;transform-origin:0 50%;
  transform:scaleX(var(--v,.4));background:linear-gradient(90deg,var(--blue),var(--cyan));
  box-shadow:0 0 10px rgba(99,180,255,.7);
  transition:transform .18s cubic-bezier(.2,.9,.2,1)}
.readout .row:nth-child(2n) .bar i{background:linear-gradient(90deg,var(--purple),var(--purple2));
  box-shadow:0 0 10px rgba(185,129,255,.7)}
.readout .row:nth-child(3n) .bar i{background:linear-gradient(90deg,var(--green),var(--green2));
  box-shadow:0 0 10px rgba(140,255,26,.7)}
.readout .pip{width:1.5vmin;height:1.5vmin;min-width:6px;min-height:6px;
  background:rgba(99,180,255,.3);transform:rotate(45deg);animation:gbar 1.1s ease-in-out infinite}

/* spectrum */
.spectrum{flex:1;min-height:0;display:flex;align-items:flex-end;
  gap:clamp(1px,.32vmin,4px);border-bottom:1px solid rgba(99,180,255,.3);padding-bottom:2px}
.spectrum i{flex:1;transform-origin:50% 100%;transform:scaleY(var(--v,.2));min-height:2px;
  background:linear-gradient(180deg,var(--green2),var(--green) 26%,var(--blue) 74%,var(--purple));
  box-shadow:0 0 8px rgba(99,180,255,.55);transition:transform .07s linear}
.spectrum i:nth-child(4n){background:linear-gradient(180deg,var(--cyan),var(--blue2) 60%,var(--purple))}

/* wireframe geometry */
.cubewrap{position:relative;flex:1;min-height:0;display:grid;place-items:center;
  perspective:52vmin}
.cube{--s:clamp(46px,12.5vmin,128px);width:var(--s);height:var(--s);position:relative;
  transform-style:preserve-3d;animation:cubeA 9s linear infinite}
.cube .f{position:absolute;inset:0;border:1px solid rgba(99,180,255,.75);
  box-shadow:inset 0 0 22px rgba(99,180,255,.22),0 0 10px rgba(99,180,255,.35);
  background:linear-gradient(135deg,rgba(99,180,255,.07),transparent 60%)}
.cube .f::after{content:"";position:absolute;inset:14%;border:1px dashed rgba(140,255,26,.35);
  animation:spin 4s linear infinite}
.cube .f1{transform:translateZ(calc(var(--s)/2))}

  transform-origin:50% 50%}
.polybox .p1{stroke:rgba(185,129,255,.75);animation:spin 7s linear infinite;

.polybox .p2{stroke:rgba(140,255,26,.6);animation:spin 4.4s linear reverse infinite}

<script>
(() => {
'use strict';
/* ═════════ utils ═════════ */
const TAU = Math.PI * 2, PI = Math.PI;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];
const DPR = () => Math.min(2, window.devicePixelRatio || 1);
const root = document.documentElement;
const stage = document.getElementById('stage');
const REDUCED = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const NS = 'http://www.w3.org/2000/svg';
const mk = (n, a) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

function fit(cv, ctx) {
  const r = cv.getBoundingClientRect(), d = DPR();
  cv.width = Math.max(1, Math.round(r.width * d));
  cv.height = Math.max(1, Math.round(r.height * d));
  ctx.setTransform(d, 0, 0, d, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  return { w: r.width, h: r.height };
}

/* glyph soup — symbols only, zero lexical content */
const GLYPH = ('ΛΞΣΩΔ∇ΠΘΦΨ⌁∞≠±×÷◈◉◎●○◐◑△▽▲▼◆◇■□▓▒░╱╲╳⏦⧗⟨⟩⌘⏢│─┌┐└┘├┤┬┴┼║═╔╗╚╝∿⊕⊗⊘⊙⟁◫⬡⬢⏣⏥⇅⧖')
  .split('').filter((g, i, a) => a.indexOf(g) === i);
(function prune() {
  const c = document.createElement('canvas').getContext('2d');
  c.font = '16px monospace';
  const w0 = c.measureText('█').width;
  for (let i = GLYPH.length - 1; i >= 0; i--)
    if (Math.abs(c.measureText(GLYPH[i]).width - w0) > .6) GLYPH.splice(i, 1);
})();
const g1 = () => GLYPH[(Math.random() * GLYPH.length) | 0];

/* ═════════ DOM scaffolding ═════════ */
document.querySelectorAll('[data-glyphs]').forEach(el => {
  const n = +el.dataset.glyphs;
  for (let i = 0; i < n; i++) {
    const b = document.createElement('i');
    b.style.animationDelay = (-Math.random() * 1.6).toFixed(2) + 's';
    el.appendChild(b);
  }
});
const RUNE_BLOCK = 80;
document.querySelectorAll('[data-rain]').forEach(el => {
  const n = +el.dataset.rain;
  for (let c = 0; c < n; c++) {
    const col = document.createElement('div');
    col.className = 'rain-col';
    col.style.setProperty('--d', rnd(1.1, 2.6).toFixed(2) + 's');
    col.style.setProperty('--dl', (-rnd(0, 2.6)).toFixed(2) + 's');
    const build = () => {
      let h = '';
      for (let i = 0; i < RUNE_BLOCK; i++) h += '<span>' + g1() + '</span>';
      col.innerHTML = h + h;
    };
    build();
    col._rebuild = build;
    el.appendChild(col);
  }
});
document.querySelectorAll('[data-readout]').forEach(el => {
  for (let i = 0, n = +el.dataset.readout; i < n; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = '<i class="tick a"></i><span class="bar"><i></i></span><i class="pip"></i>';
    el.appendChild(row);
  }
});
document.querySelectorAll('[data-spectrum]').forEach(el => {
  for (let i = 0, n = +el.dataset.spectrum; i < n; i++) el.appendChild(document.createElement('i'));
});
document.querySelectorAll('[data-conveyor]').forEach(el => {
  for (let i = 0, n = +el.dataset.conveyor; i < n; i++) {
    const b = document.createElement('i');
    b.style.setProperty('--i', i);
    el.appendChild(b);
  }
});
/* glitch tear strips (HTML so they can blur independently of the SVG frame) */
const TEARS = [];
document.querySelectorAll('.panel').forEach(p => {
  for (let i = 0; i < 3; i++) {
    const s = document.createElement('i');
    s.className = 'tear';
    p.appendChild(s);
    TEARS.push(s);
  }
});

/* ═════════ 1 · BACKGROUND DATA STREAMS ═════════ */
const CW = 18, CH = 18;
const st = { cv: document.getElementById('cv-streams'), ctx: null, cols: [], w: 0, h: 0 };
st.ctx = st.cv.getContext('2d', { alpha: true });
function paintStrip(c) {
  const d = Math.min(1.5, DPR()), h = c.len * CH;
  if (!c.strip) c.strip = document.createElement('canvas');
  c.strip.width = Math.ceil(13 * d);
  c.strip.height = Math.ceil(h * d);
  const g = c.strip.getContext('2d');
  g.setTransform(d, 0, 0, d, 0, 0);
  g.clearRect(0, 0, 13, h);
  g.textBaseline = 'top';
  g.font = '13px ui-monospace, monospace';
  for (let j = 0; j < c.len; j++) {
    const e = Math.pow(1 - j / c.len, 1.55);
    g.globalAlpha = Math.max(0, e * c.a);
    g.fillStyle = 'hsl(' + c.hue + ' 100% ' + (56 + j * 1.2).toFixed(0) + '%)';
    g.fillText(GLYPH[(Math.random() * GLYPH.length) | 0], 0, j * CH);
  }
  g.globalAlpha = 1;
}
function buildStreams() {
  const s = fit(st.cv, st.ctx);
  st.w = s.w; st.h = s.h;
  st.cols = [];
  const n = Math.max(8, Math.ceil(s.w / CW));
  for (let i = 0; i < n; i++) {
    const r = Math.random();
    const c = {
      x: i * CW + 3, y: rnd(0, 4000), sp: rnd(26, 200) * (r > .93 ? 3.4 : 1),
      len: Math.round(rnd(9, 26)),
      hue: r < .34 ? 212 : r < .64 ? 268 : 88,
      a: r < .34 ? .8 : r < .64 ? .75 : 1, t: 0
    };
    paintStrip(c);
    st.cols.push(c);
  }
}
function drawStreams(dt, t, f) {
  const ctx = st.ctx, W = st.w, H = st.h;
  if (!W) return;
  ctx.clearRect(0, 0, W, H);
  for (const c of st.cols) {
    c.y += c.sp * dt * (1 + f * 2.6);
    c.t -= dt;
    if (c.t <= 0) { if (Math.random() < .28) paintStrip(c); c.t = rnd(.14, .34); }
    const Hh = c.len * CH, s = ((c.y % Hh) + Hh) % Hh;
    ctx.globalAlpha = .40 + f * .55;
    ctx.drawImage(c.strip, c.x, s, 13, Hh);
    ctx.drawImage(c.strip, c.x, s - Hh, 13, Hh);
  }
  ctx.globalAlpha = 1;
  /* horizontal packet burst */
  if (Math.random() < .3 + f * .9) {
    const y = Math.random() * H, x = Math.random() < .5 ? 0 : W, dir = x === 0 ? 1 : -1;
    const len = rnd(40, 280), hue = pick([212, 268, 88, 190]);
    ctx.strokeStyle = 'hsla(' + hue + ',100%,68%,.9)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    const ex = x + dir * len;
    ctx.moveTo(x, y);
    for (let k = 1; k <= 6; k++) ctx.lineTo(lerp(x, ex, k / 6), y + rnd(-1.4, 1.4));
    ctx.stroke();
  }
}
/* ═════════ 2 · VORTEX PARTICLE ENGINE ═════════ */
const vx = { cv: document.getElementById('cv-vortex'), ctx: null, w: 0, h: 0,
  cx: 0, cy: 0, R: 0, arms: 3, parts: [], dust: [], rings: [], bolts: [],
  N: 900, quality: 1 };
vx.ctx = vx.cv.getContext('2d', { alpha: true });
/* cached stroke ramp: white-cyan core → electric blue → deep purple → acid green rim */
const RAMP = 32, COLS = [];
for (let i = 0; i < RAMP; i++) {
  const u = i / (RAMP - 1);
  let h, s, l;
  if (u < .16) { h = 190; s = 100; l = 88; }
  else if (u < .44) { const k = (u - .16) / .28; h = lerp(214, 224, k); s = 100; l = lerp(72, 58, k); }
  else if (u < .74) { const k = (u - .44) / .30; h = lerp(224, 268, k); s = lerp(100, 88, k); l = lerp(58, 66, k); }
  else { const k = (u - .74) / .26; h = lerp(268, 88, k); s = lerp(88, 100, k); l = lerp(66, 64, k); }

    .concat(jagged(nx, ny, x1, y1, disp * .55, depth - 1));
}
const d2s = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L');
function strike() {
  const W = innerWidth, H = innerHeight;
  const col = 'hsl(' + pick([190, 212, 268, 88]) + ',100%,78%)';
  const fromTop = Math.random() < .62;
  const x0 = fromTop ? rnd(-40, W + 40) : (Math.random() < .5 ? -30 : W + 30);
  const y0 = fromTop ? -20 : H + 20;
  const x1 = rnd(W * .12, W * .88), y1 = rnd(H * .08, H * .92);
  const main = jagged(x0, y0, x1, y1, .055, 6);
  const g = mk('g', {});
  /* hard-edged (unblurred) high-contrast shadows */
  g.appendChild(mk('path', { d: d2s(main), stroke: '#000', 'stroke-width': 8, opacity: .7,
    transform: 'translate(8,8)' }));
  g.appendChild(mk('path', { d: d2s(main), stroke: col, 'stroke-width': 7, opacity: .26,
    transform: 'translate(-6,-5)' }));
  const core = mk('path', { d: d2s(main), stroke: '#fff', 'stroke-width': 2.1, pathLength: 1,
    'stroke-dasharray': '1 1', 'stroke-dashoffset': 1 });
  core.style.animation = 'boltDraw .19s steps(7) forwards';
  g.appendChild(core);
  /* branches */
  for (let i = 0; i < 3; i++) {
    const k = ((i * 7 + 3) % (main.length - 2)) + 1;
    const a = main[k], b = main[k + 1] || main[k];
    g.appendChild(mk('path', { d: d2s(jagged(a[0], a[1], b[0] + rnd(-90, 90), b[1] + rnd(-160, 160), .06, 3)),
      stroke: col, 'stroke-width': 1.1, opacity: .5 }));
    g.appendChild(mk('path', { d: d2s(jagged(a[0], a[1], b[0] + rnd(-70, 70), b[1] + rnd(-120, 120), .05, 3)),
      stroke: '#fff', 'stroke-width': .7, opacity: .65 }));
  }
  boltG.appendChild(g);
  setTimeout(() => g.remove(), 320);
  /* inner vortex arcs + shockwave */
  for (let i = 0; i < 3; i++) vx.bolts.push({
    r0: vx.R * rnd(.12, .3), a0: rnd(0, TAU), sweep: rnd(1.2, 3.4) * pick([-1, 1]),
    life: rnd(.12, .3), max: .3
  });
  vx.rings.push({ r: vx.R * .1, v: vx.R * rnd(2.2, 4.6), a: .95, d: rnd(1.1, 2.1), w: 3,
    c: 'hsla(' + pick([190, 212, 268, 88]) + ',100%,70%' });
  /* envelope: main slam + delayed after-strike */
  const now = performance.now() / 1000, amp = rnd(.6, 1);
  pulses.push({ t0: now, amp, k: 14 });
  pulses.push({ t0: now + .07, amp: amp * rnd(.35, .7), k: 20 });
  if (Math.random() < .26) strobe = .5 + Math.random() * .5;
}
function glare(x, y, sz, hue) {
  const g = mk('g', {});
  g.appendChild(mk('rect', { x: -sz / 2, y: -sz / 2, width: sz, height: sz * .5,
    fill: 'hsl(' + hue + ',100%,80%)', opacity: .2,
    transform: 'translate(' + x + ' ' + y + ') rotate(' + rnd(-40, 40) + ')' }));
  g.appendChild(mk('rect', { x: -sz, y: -sz * .06, width: sz * 2, height: sz * .12, fill: '#fff',
    opacity: .45, transform: 'translate(' + x + ' ' + y + ') rotate(' + rnd(-70, 70) + ')',
    filter: 'drop-shadow(0 0 18px #fff)' }));
  boltG.appendChild(g);
  setTimeout(() => g.remove(), 170);
}
function flashAt(now) {
  let f = 0;
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i], age = now - p.t0;
    if (age > 1.3) { pulses.splice(i, 1); continue; }
    if (age < 0) continue;
    f += p.amp * Math.exp(-age * p.k) * (1 + Math.sin(age * 90) * .5);
  }
  return clamp(f, 0, 1.25);
}

/* ═════════ 6 · GLITCH BURSTS ═════════ */
let glitchOn = false, glitchEnd = 0;
function doGlitch() {
  glitchOn = true; glitchEnd = T + rnd(.05, .16);
  stage.classList.add('glitching');
  root.style.setProperty('--gx', rnd(-9, 9).toFixed(1) + 'px');
  root.style.setProperty('--gy', rnd(-6, 6).toFixed(1) + 'px');
  for (let i = 0; i < TEARS.length; i++) {
    const b = i % 3;
    TEARS[i].style.top = (b === 0 ? rnd(4, 30) : b === 1 ? rnd(34, 70) : rnd(71, 95)).toFixed(1) + '%';
    TEARS[i].style.opacity = rnd(.5, 1).toFixed(2);
  }
  if (Math.random() < .45)
    glare(rnd(0, innerWidth), rnd(0, innerHeight), rnd(40, 240), pick([190, 268, 88]));
}
function endGlitch() {
  if (glitchOn && T > glitchEnd) {
    glitchOn = false;
    stage.classList.remove('glitching');
    root.style.setProperty('--gx', '0px');
    root.style.setProperty('--gy', '0px');
    for (const s of TEARS) s.style.opacity = '';
  }
}

/* ═════════ 7 · DOM DRIVERS (abstract readouts) ═════════ */
const SPEC = [...document.querySelectorAll('[data-spectrum]')].map(el => ({
  kids: [...el.children], v: new Float32Array(el.children.length),
  w: new Float32Array(el.children.length).fill(-1)
}));
const BARS = [...document.querySelectorAll('.readout .bar i')].map(b => ({
  el: b, v: Math.random(), t: rnd(0, .5)
}));
const RAIN = [...document.querySelectorAll('.rain-col')];
const GLYPHBARS = [...document.querySelectorAll('.glyphbar i')];
function driveDOM(dt, t, f) {
  for (const S of SPEC) {
    for (let i = 0; i < S.kids.length; i++) {
      const n = Math.sin(t * 2.1 + i * .38) * .5 + Math.sin(t * 5.7 - i * .21) * .28
        + Math.sin(t * 11.3 + i * .9) * .12;
      const target = clamp(Math.abs(n) * (.62 + f * .8) + .04, .03, 1);
      S.v[i] = target > S.v[i] ? lerp(S.v[i], target, .55) : lerp(S.v[i], target, .12);
      if (Math.abs(S.v[i] - S.w[i]) > .008) {
        S.w[i] = S.v[i];
        S.kids[i].style.setProperty('--v', S.v[i].toFixed(3));
      }
    }
  }
  for (const B of BARS) {
    B.t -= dt;
    if (B.t <= 0) { B.v = rnd(.08, 1); B.t = rnd(.1, .55); }
    B.el.style.setProperty('--v', (B.v * (.75 + f * .45)).toFixed(3));
  }
  /* churn the glyph soup so nothing repeats */
  if (Math.random() < .012) {
    const c = RAIN[(Math.random() * RAIN.length) | 0];
    if (c) c._rebuild();
  }
  for (let i = 0; i < GLYPHBARS.length; i++) {
    if (Math.random() < .01) GLYPHBARS[i].style.animationDuration = rnd(.3, 2.4).toFixed(2) + 's';
  }
}

/* ═════════ 8 · MAIN LOOP ═════════ */
let T = 0, last = 0, frames = 0, acc = 0, running = true, lastF = -1, lastS = -1;

function frame(now) {
  if (!running) return;
  requestAnimationFrame(frame);
  if (!last) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > .05) dt = .05;
  T += dt;
  const t = T;

  /* adaptive quality: keep the storm at 60fps */
  acc += dt; frames++;
  if (frames >= 60) {
    const avg = acc / frames;
    if (avg > .024 && vx.quality > .35) { vx.quality = Math.max(.35, vx.quality * .78); buildVortex(); }
    else if (avg < .0155 && vx.quality < 1) { vx.quality = Math.min(1, vx.quality * 1.14); buildVortex(); }
    frames = 0; acc = 0;
  }

  if (t > nextFlash) { strike(); nextFlash = t + rnd(.85, 3.6); }
  if (t > nextGlitch) { doGlitch(); nextGlitch = t + rnd(.18, 1.1); }
  endGlitch();

  flash = flashAt(performance.now() / 1000);
  strobe *= Math.pow(.012, dt);
  /* only touch custom properties when they actually move (style recalc is costly) */
  if (Math.abs(flash - lastF) > .012) {
    root.style.setProperty('--f', flash.toFixed(3));
    lastF = flash;
  }
  if (strobe > .004) { root.style.setProperty('--f2', strobe.toFixed(3)); lastS = strobe; }
  else if (lastS !== 0) { root.style.setProperty('--f2', '0'); lastS = 0; }

  drawStreams(dt, t, flash);
  drawVortex(dt, t, flash);
  for (const p of PANES) if (p.fn && p.w) p.fn(p.ctx, p.w, p.h, t, flash);
  driveDOM(dt, t, flash);
}

/* ═════════ 9 · BOOT ═════════ */
function boot() {
  buildStreams();
  fitPanes();
  buildVortex();
  /* prime a few strikes + a burst so the opening frame is already electric */
  for (let i = 0; i < 3; i++) {
    vx.rings.push({ r: vx.R * rnd(.15, .6), v: vx.R * rnd(2, 4), a: rnd(.2, .7), d: rnd(1, 2),
      w: 3, c: 'hsla(' + pick([190, 212, 268, 88]) + ',100%,70%' });
  }
  if (REDUCED) {
    root.style.setProperty('--f', '0');
    T = 1.2;
    drawStreams(.016, T, 0);
    drawVortex(.016, T, 0);
    for (const p of PANES) if (p.fn && p.w) p.fn(p.ctx, p.w, p.h, T, 0);
    driveDOM(1, T, 0);
    return;
  }
  requestAnimationFrame(frame);
}
let rt = 0;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => { buildStreams(); fitPanes(); buildVortex(); }, 160);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { running = false; }
  else if (!REDUCED) { running = true; last = 0; requestAnimationFrame(frame); }
});
boot();
})();
</script>
</body>
</html>
